<!DOCTYPE html>
<html>

<head>

    <title>Chat</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">Chat with {{ receiver }}</h1>
        <div>
            <a href="/save_chat/{{ receiver }}"><button class="btn-secondary" style="margin-right: 10px;">Save Chat</button></a>
            <a href="/logout"><button class="btn-logout">Switch User</button></a>
        </div>
    </div>

    {% for msg in messages %}

    <div class="user-card" style="position: relative;">
        <h3>{{ msg[1] }}</h3>
        <p>{{ msg[3] }}</p>

        <!-- Delete Message Form -->
        <form action="/delete_message/{{ receiver }}/{{ msg[0] }}" method="POST" style="position: absolute; top: 10px; right: 10px; margin: 0;">
            <button type="submit" style="background: transparent; border: none; color: #ff4b4b; cursor: pointer; padding: 5px; font-size: 14px;" title="Delete Message">
                ✖
            </button>
        </form>
    </div>

    {% endfor %}

    <form action="/send_message/{{ receiver }}" method="POST">

        <input
        type="text"
        name="message"
        placeholder="Type message"
        required>

        <button type="submit">
            Send
        </button>

    </form>

</div>

</body>

</html>
